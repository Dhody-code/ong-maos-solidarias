<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Mãos Solidárias | Cadastro</title>
</head>
<body>
  <header>
    <img src="imagens/logo.png" alt="Logotipo da ONG Mãos Solidárias" width="96" height="96">
    <h1>Cadastro de apoiadores</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos Sociais</a></li>
        <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="formulario">
      <h2>Faça parte da ONG Mãos Solidárias</h2>
      <p>Campos marcados com * são obrigatórios.</p>
      <form action="#" method="post">
        <fieldset>
          <legend>Dados pessoais</legend>
          <p>
            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" name="nome" minlength="3" maxlength="100" required>
          </p>
          <p>
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
          </p>
          <p>
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" title="Informe o CPF no formato 000.000.000-00" required>
          </p>
          <p>
            <label for="telefone">Telefone *</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678" pattern="\(\d{2}\) \d{4,5}-\d{4}" maxlength="15" title="Informe o telefone no formato (11) 91234-5678" required>
          </p>
          <p>
            <label for="nascimento">Data de nascimento *</label>
            <input type="date" id="nascimento" name="nascimento" min="1900-01-01" max="2026-12-31" required>
          </p>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>
          <p>
            <label for="cep">CEP *</label>
            <input type="text" id="cep" name="cep" inputmode="numeric" placeholder="00000-000" pattern="\d{5}-\d{3}" maxlength="9" title="Informe o CEP no formato 00000-000" required>
          </p>
          <p>
            <label for="endereco">Endereço (rua, número e complemento) *</label>
            <input type="text" id="endereco" name="endereco" autocomplete="address-line1" maxlength="120" required>
          </p>
          <p>
            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" name="cidade" maxlength="60" required>
          </p>
          <p>
            <label for="estado">Estado *</label>
            <select id="estado" name="estado" required>
              <option value="">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
          </p>
        </fieldset>

        <fieldset>
          <legend>Como deseja apoiar *</legend>
          <p>
            <input type="radio" id="apoio-voluntario" name="apoio" value="voluntario" required>
            <label for="apoio-voluntario">Voluntário</label>
            <input type="radio" id="apoio-doador" name="apoio" value="doador">
            <label for="apoio-doador">Doador</label>
            <input type="radio" id="apoio-ambos" name="apoio" value="ambos">
            <label for="apoio-ambos">Ambos</label>
          </p>
          <p>Áreas de interesse:</p>
          <p>
            <input type="checkbox" id="area-educacao" name="areas" value="educacao">
            <label for="area-educacao">Educação</label>
            <input type="checkbox" id="area-alimentacao" name="areas" value="alimentacao">
            <label for="area-alimentacao">Alimentação</label>
            <input type="checkbox" id="area-capacitacao" name="areas" value="capacitacao">
            <label for="area-capacitacao">Capacitação profissional</label>
          </p>
          <p>
            <label for="mensagem">Mensagem (opcional)</label>
            <textarea id="mensagem" name="mensagem" rows="4" cols="40" maxlength="500"></textarea>
          </p>
        </fieldset>

        <fieldset>
          <legend>Consentimento</legend>
          <p>
            <input type="checkbox" id="consentimento" name="consentimento" value="sim" required>
            <label for="consentimento">Autorizo o uso dos meus dados para contato pela ONG. *</label>
          </p>
        </fieldset>

        <p>
          <button type="submit">Enviar cadastro</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ONG Mãos Solidárias. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
